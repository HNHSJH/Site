name: Temporary SERP title string replacement

on:
  push:
    branches:
      - differentiate-serp-titles

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace only duplicated SERP title strings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = [
              (
                  'About H&H Resources | Sports Construction Singapore',
                  'About H&H Resources | Since 1980 in Singapore',
                  'About H&amp;H Resources | Sports Construction Singapore',
                  'About H&amp;H Resources | Since 1980 in Singapore',
              ),
              (
                  'Sports Construction Services Singapore | H&H Resources',
                  'Sports Fields, Courts & Surfacing Services | H&H Resources',
                  'Sports Construction Services Singapore | H&amp;H Resources',
                  'Sports Fields, Courts &amp; Surfacing Services | H&amp;H Resources',
              ),
              (
                  'Contact H&H Resources | Sports Construction Enquiries',
                  'Contact H&H Resources | Project Enquiries Singapore',
                  'Contact H&amp;H Resources | Sports Construction Enquiries',
                  'Contact H&amp;H Resources | Project Enquiries Singapore',
              ),
          ]

          targets = list(Path('.').rglob('*.html')) + [Path('tools/build-seo.py')]
          changed = []
          totals = {old: 0 for old, *_ in replacements}

          for path in targets:
              text = path.read_text()
              original = text
              for old, new, old_html, new_html in replacements:
                  count_plain = text.count(old)
                  count_html = text.count(old_html)
                  totals[old] += count_plain + count_html
                  text = text.replace(old, new).replace(old_html, new_html)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          for old, total in totals.items():
              if total == 0:
                  raise SystemExit(f'Expected old title not found anywhere: {old}')

          sitemap = Path('sitemap.xml')
          text = sitemap.read_text()
          for route in ('about-us/', 'services/', 'contact/'):
              pattern = rf'(<loc>https://hnhresources\.com/{re.escape(route)}</loc>\s*<lastmod>)[^<]+(</lastmod>)'
              text, count = re.subn(pattern, rf'\g<1>2026-09-17\2', text)
              if count != 1:
                  raise SystemExit(f'Expected sitemap entry missing: {route}')
          sitemap.write_text(text)

          print('Changed files:')
          for path in changed:
              print(path)
          PY

      - name: Validate exact title cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              'about-us/index.html': 'About H&amp;H Resources | Since 1980 in Singapore',
              'services/index.html': 'Sports Fields, Courts &amp; Surfacing Services | H&amp;H Resources',
              'contact/index.html': 'Contact H&amp;H Resources | Project Enquiries Singapore',
          }
          old_variants = [
              'About H&H Resources | Sports Construction Singapore',
              'About H&amp;H Resources | Sports Construction Singapore',
              'Sports Construction Services Singapore | H&H Resources',
              'Sports Construction Services Singapore | H&amp;H Resources',
              'Contact H&H Resources | Sports Construction Enquiries',
              'Contact H&amp;H Resources | Sports Construction Enquiries',
          ]

          for path, title in expected.items():
              text = Path(path).read_text()
              if f'<title>{title}</title>' not in text:
                  raise SystemExit(f'Expected direct-page title missing: {path}')

          scan = '\n'.join(p.read_text() for p in Path('.').rglob('*.html')) + Path('tools/build-seo.py').read_text()
          for old in old_variants:
              if old in scan:
                  raise SystemExit(f'Old duplicated title still present: {old}')

          home = Path('index.html').read_text()
          for visible in (
              'About H&H Resources | Since 1980 in Singapore',
              'Sports Fields, Courts & Surfacing Services | H&H Resources',
              'Contact H&H Resources | Project Enquiries Singapore',
          ):
              if visible not in home and visible.replace('&', '&amp;') not in home:
                  raise SystemExit(f'New route title missing from homepage shell: {visible}')

          print('PASS: direct titles and shared route titles are differentiated; old title strings are gone.')
          PY

      - name: Commit title-only metadata changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' tools/build-seo.py sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Differentiate main-page SERP titles"
          git push
