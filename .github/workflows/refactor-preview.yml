name: HNH Refactor Preview

on:
  push:
    branches:
      - refactor-preview-build-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate builder
        run: python -m py_compile tools/refactor_preview.py

      - name: Build refactored directory
        run: python tools/refactor_preview.py

      - name: Validate JavaScript syntax
        run: |
          for file in refactor-output/assets/js/*.js; do
            node --check "$file"
          done

      - name: Show refactor report
        run: cat refactor-output/REFACTOR_REPORT.md

      - name: Upload local-review package
        uses: actions/upload-artifact@v4
        with:
          name: HNH-Refactor-Preview
          path: refactor-output/
          if-no-files-found: error
          retention-days: 7
